# Render Blueprint for the free live demo (Render dashboard -> New -> Blueprint -> this repo).
# One free web service built from deploy/single-container/Dockerfile.
services:
  - type: web
    name: tripare-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/single-container/Dockerfile
    dockerContext: .
    # Liveness only (same rule as Compose: /health is for humans and readiness scripts).
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      # Random secret generated by Render; required for the /__chaos routes.
      - key: CHAOS_TOKEN
        generateValue: true
