name: keep-warm

# Render's free plan sleeps a service after 15 minutes without traffic (the next request then
# waits for a cold start). Ping the live demo every 10 minutes, and twice a day also run the full
# smoke test so a broken deployment is noticed. Enable it by setting the repo variable LIVE_URL
# (Settings -> Secrets and variables -> Actions -> Variables), e.g. https://tripare-ai.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ vars.LIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping (waits through a cold start)
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 30 "${{ vars.LIVE_URL }}/ping" && exit 0
            sleep 15
          done
          exit 1
      - if: github.event.schedule != '*/10 * * * *'
        uses: actions/checkout@v4
      - if: github.event.schedule != '*/10 * * * *'
        run: ./scripts/wait-healthy.sh "${{ vars.LIVE_URL }}" 300 && ./scripts/smoke.sh "${{ vars.LIVE_URL }}"
